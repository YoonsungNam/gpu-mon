{{- if .Values.fileSD.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vmagent-central.fullname" . }}-file-sd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vmagent-central.labels" . | nindent 4 }}
data:
{{- if .Values.fileSD.data }}
{{- toYaml .Values.fileSD.data | nindent 2 }}
{{- end }}
{{- end }}
